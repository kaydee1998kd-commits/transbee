name: BubbleTranslate
options:
  bundleIdPrefix: com.bubbletranslate
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

targets:
  BubbleTranslate:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "15.0"
    sources:
      - path: BubbleTranslate/Sources
        type: group
        includes:
          - "*.swift"
      - path: BubbleTranslate/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubbletranslate.app
        PRODUCT_NAME: BubbleTranslate
        EXECUTABLE_NAME: BubbleTranslate
        INFOPLIST_FILE: BubbleTranslate/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SDKROOT)/Developer/Library/Frameworks"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "UIKit", "-framework", "Foundation", "-framework", "Vision", "-framework", "AVFoundation", "-framework", "CoreImage", "-framework", "ObjectiveC"]
    entitlements:
      path: BubbleTranslate/BubbleTranslate.entitlements
    scheme:
      testTargets:
        - BubbleTranslate
      configMappings:
        Debug: Debug
        Release: Release
